databases:
  - name: world-soccer-predictor-db
    plan: free

services:
  - type: web
    name: world-soccer-predictor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_HOST
        fromDatabase:
          name: world-soccer-predictor-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: world-soccer-predictor-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: world-soccer-predictor-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: world-soccer-predictor-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: world-soccer-predictor-db
          property: password
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_ID
        value: gpt-4o-mini