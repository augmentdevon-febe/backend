spring:
  datasource:
    url: jdbc:h2:file:./data/worldcupdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,profile,email

logging:
  level:
    root: INFO
    com.example.worldcuppredictor: DEBUG

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true

app:
  ai:
    provider: m365-copilot
    model: ${M365_COPILOT_MODEL_ID:m365-copilot-default}

