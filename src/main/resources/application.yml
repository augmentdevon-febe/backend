spring:
  config:
    import: optional:dotenv:.env
  datasource:
    url: jdbc:h2:file:./data/worldcupdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            client-name: Google
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: https://accounts.google.com

logging:
  level:
    root: INFO
    com.example.worldcuppredictor: DEBUG

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    fallback-redirect: ${APP_FALLBACK_REDIRECT:http://localhost:4200/login}
    allowed-origin-prefixes: ${APP_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200}
  ai:
    provider: openai
    model: ${OPENAI_MODEL_ID:gpt-4o-mini}

